services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: usuario
      POSTGRES_PASSWORD: senha
      POSTGRES_DB: marcenaria
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis: # necessário a partir da Fase 6
    image: redis:7
    ports: ["6379:6379"]
volumes:
  pgdata:
